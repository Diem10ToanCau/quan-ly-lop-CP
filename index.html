<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1" name="viewport"/>
<title>Quản lý lớp — Gọn gàng trong từng tiết</title>
<meta content="Webapp quản lý lớp học cho giáo viên: theo dõi học sinh, điểm TX, lượt gọi tên, vi phạm, đồng bộ Google Sheet." name="description"/>
<meta content="#1D6FE5" name="theme-color"/>
<link href="./logo.png" rel="icon" type="image/png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;display=swap" rel="stylesheet"/>
<script crossorigin="" src="./assets/index-DHZElYMk.js" type="module"></script>
<link crossorigin="" href="./assets/index-BlzPCnRT.css" rel="stylesheet"/>

</head>
<body>

<div id="root"></div>
<script>
  (function () {
    function textOf(el) {
      return (el.textContent || "").replace(/\s+/g, " ").trim();
    }

    function hideClosestSmallBlock(el) {
      var block = el;
      for (var i = 0; i < 4 && block; i += 1) {
        var text = textOf(block);
        var inputCount = block.querySelectorAll ? block.querySelectorAll("input").length : 0;
        if (inputCount > 0 && text.length < 120) {
          block.style.display = "none";
          return;
        }
        block = block.parentElement;
      }
      el.style.display = "none";
    }

    function hideExactText(labelText) {
      document.querySelectorAll("label, span, p, h3, h4").forEach(function (el) {
        if (textOf(el) === labelText) hideClosestSmallBlock(el);
      });
    }

    function hideUnusedScoreSection() {
      document.querySelectorAll("label, span, p, h3, h4").forEach(function (el) {
        var text = textOf(el);
        if (text === "ĐIỂM SỐ & KỶ LUẬT") {
          el.style.display = "none";
        }
        if (text === "Điểm TX1 - TX4 (để trống nếu chưa có)") hideClosestSmallBlock(el);
      });

      hideExactText("Số lần gọi tên");
      hideExactText("Điểm cộng");
      hideExactText("Số lần vi phạm");

      document.querySelectorAll('input[placeholder="TX1"], input[placeholder="TX2"], input[placeholder="TX3"], input[placeholder="TX4"]').forEach(function (input) {
        hideClosestSmallBlock(input);
      });
    }

    window.addEventListener("DOMContentLoaded", hideUnusedScoreSection);
    new MutationObserver(hideUnusedScoreSection).observe(document.documentElement, {
      childList: true,
      subtree: true
    });
  })();
</script>
</body>
</html>
